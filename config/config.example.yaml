# Copy to config.yaml and mount into the container at /config/config.yaml.
# Secrets (accessKeyId/secretAccessKey below) are expected as ${VAR} placeholders,
# resolved from the process environment or from a .env file mounted at /config/.env.
#
# NOTE: DNS-change detection is driven by a local IP cache (/data/cache.json), not a
# live DNS lookup. If a record is changed manually outside of Cuddns, Cuddns won't
# notice until the public IP itself changes again.
#
# NOTE: each records entry is a hostname optionally suffixed with ":a" or ":aaaa" to
# pick the record type (":a" is the default, so plain hostnames are unchanged). List
# the same hostname twice — once per suffix — to manage both A and AAAA for it.
#
# NOTE: removing a hostname from records just stops Cuddns from touching it — the
# record stays at the provider. Route53 and Cloudflare can opt into cleaning up after
# themselves with "pruneRemovedRecords: true" on the provider (see the commented example on
# the route53 block below); DuckDNS/No-IP don't support this at all (their APIs have no
# delete verb), so don't set it there.

intervalSeconds: 300

# Optional: attempt public IPv6 lookups at all. Defaults to false. Turn this on if any
# record below uses the ":aaaa" suffix (see records examples further down); otherwise
# leaving it off avoids pointless network calls and log noise on hosts without IPv6.
# enableIpv6: false

# Optional: which public-IP lookup sources to try, in order (first one that answers wins,
# independently for IPv4 and IPv6). Omit this to use the built-in default order shown below.
# publicIpSources:
#   - ifconfig
#   - ipify
#   - icanhazip
#   - identme

providers:
  - type: route53
    accessKeyId: ${AWS_ACCESS_KEY_ID}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
    region: us-east-1
    # pruneRemovedRecords: true
    zones:
      - hostedZoneId: Z0123456789ABCDEFGHIJ
        ttl: 300
        records:
          - example.com
          - www.example.com
          - vpn.example.com
          - vpn.example.com:aaaa
      - hostedZoneId: Z9876543210JIHGFEDCBA
        ttl: 300
        records:
          - photos.example.com
          - cloud.example.com

  - type: duckdns
    token: ${DUCKDNS_TOKEN}
    records:
      - home.duckdns.org

  - type: cloudflare
    apiToken: ${CLOUDFLARE_API_TOKEN}
    zones:
      - zoneId: 023e105f4ecef8ad9ca31a8372d0c353
        ttl: 300
        proxied: false
        records:
          - home.example.com
          - vpn.example.com

  - type: noip
    username: ${NOIP_USERNAME}
    password: ${NOIP_PASSWORD}
    records:
      - home.example.com
